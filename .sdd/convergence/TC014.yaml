task_id: TC014
title: Implement repository-backed SPEC-017 recovery authorization lifecycle
objective: >-
  Implement the approved repository-backed SPEC-017 RecoveryAuthorization lifecycle
  by extending the existing RecoveryAuthorization primitive with serialization,
  repository storage, Project Authority issuance, runtime load and validation,
  atomic one-time consumption, audit/status events, and authorization-ID-based
  recovery execution.
root_cause: >-
  AUTHORIZATION_PERSISTENCE_AND_LOADING_GAP: the existing RecoveryAuthorization is
  an in-memory domain value and the recovery executor can receive a caller-supplied
  instance; no repository-backed issuance, lookup, lifecycle, or consumption
  mechanism currently establishes execution authority.
repair_classification: SPEC017_RECOVERY_AUTHORIZATION_LIFECYCLE
