affected_components:
  - 'RecoveryAuthorizationStore._active_records(): changed; every record gets clock-free integrity validation and only ACTIVE records are returned.'
  - 'RecoveryAuthorizationStore.load(): no code change; overlap scanning and lookup by recovery operation work again; per-grant validate(require_active=...) still applies time checks.'
  - 'ProjectAuthorityRecoveryAuthorizationIssuer.issue(): no code change; overlap scan works again; the new grant is still checked with validate(require_active=True).'
  - 'RecoveryAuthorizationStore.consume(): no code change; still goes through load(require_active=True).'
  - 'Stage08CodexRunner.recover_post_checkpoint_evidence(): no code change; reaches the store only through load()/consume().'
semantic_rules:
  - 'R1: Every stored authorization gets non-clock integrity validation before filtering, using the rules of validate() except its two current-time comparisons: required non-blank fields; schema version and record kind; Project Authority issuer and issuer role; recovery purpose; status in RECOVERY_AUTHORIZATION_STATUSES and one_time true; safe authorization and attempt identifier formats; full 40-hex target checkpoint, baseline, and runtime checkpoint; 64-hex task digest; non-empty authority versions with 64-hex digests; non-empty allowed artifact paths under .sdd/ without ..; non-empty prohibited operations and checkpoint conditions; issued_at and expires_at parse as UTC with expires_at > issued_at; non-empty status-event chain with sequence numbers, previous_event_digest links, every event_digest, and status projection; grant_digest; record_digest.'
  - 'R2: Integrity failures still fail closed. Any R1 failure on any record raises GitRuntimeError from enumeration, as an integrity failure does today: malformed or unreadable records, bad digests, broken chains, wrong status projection, wrong schema or issuer.'
  - 'R3: Current wall-clock time is not used during enumeration. No record is rejected during enumeration because of the current time.'
  - 'R4: Only records with status ACTIVE are returned. CONSUMED, REVOKED, and EXPIRED records are checked for integrity but are never returned and cannot block enumeration merely because their execution window has passed.'
  - 'R5: Expired ACTIVE authorization remains unusable. load(authorization_id), load(recovery_operation_id), and consume() keep calling validate(require_active=True), which raises expired.'
  - 'R6: An expired authorization whose status is still ACTIVE remains returned by _active_records() for conflict detection, so issue() and load() continue to treat it as overlapping and fail closed (AGENTS.md section 9.1: overlapping active authorizations are ambiguity and must block). Clearing a stale ACTIVE grant would require a separately authorized status transition; no such capability exists and TC018 adds none. No live record is currently ACTIVE. R6 must not be silently reinterpreted.'
  - 'R7: No authorization file is rewritten, transitioned, normalized, or deleted, and there is no expiry bypass anywhere.'
r6_stale_active_policy:
  rule: R6
  policy: EXPIRED_ACTIVE_REMAINS_OPEN_FOR_CONFLICT_DETECTION
  stage07_policy_confirmation_required: true
  alternative_not_adopted: >-
    Ignoring expired ACTIVE grants during overlap detection would allow a second
    grant to be issued while the first is still nominally open.
implementation_plan:
  - Add RecoveryAuthorizationStore._validate_record_integrity(self, record) -> None in sdd_orchestrator/git_runtime.py.
  - 'It validates the same non-clock integrity properties required by validate(): required fields; schema; record kind; Project Authority issuer and role; purpose; legal status; one_time; identifier formats; checkpoint, baseline, and runtime SHA formats; task digest; authority versions; artifact paths; prohibited operations; checkpoint conditions; issued_at and expires_at parseability; expires_at > issued_at; event chain integrity; event sequence; previous_event_digest links; event_digest; status projection; grant_digest; record_digest. It raises GitRuntimeError with the existing reason-style messages (SCHEMA_INVALID / AUTHORITY_INVALID) and reuses the constants, canonical_sha256, and _parse_utc already imported by git_runtime.py.'
  - It must not inspect the current time.
  - In _active_records(), replace record.validate(require_active=False) with self._validate_record_integrity(record).
  - Keep _read(path), the sorted *.yaml enumeration, and the status == "ACTIVE" filter unchanged.
  - Make no other production-code change; load(), consume(), and issue() stay exactly as they are, validate() is not edited, and the TC017 helpers are not touched (any later consolidation is a separate task).
test_plan:
  - 'Expired historical CONSUMED record (clock frozen after expiry): enumeration succeeds and the record is not returned.'
  - 'Expired ACTIVE record (clock frozen after expiry): returned by _active_records(); load(authorization_id) and load(recovery_operation_id) reject as expired; consume() rejects; overlapping issue() is blocked with overlapping ACTIVE.'
  - 'Valid ACTIVE record inside its window: returned, loads, and consumes exactly once.'
  - 'CONSUMED record after consumption: no longer returned as active.'
  - 'REVOKED and EXPIRED historical records past expires_at: do not block enumeration solely due to wall-clock expiry and are not returned as active.'
  - 'Integrity-negative cases on a historical non-active record, each making _active_records() (and issue()/load() through it) raise: malformed record (field tampered without digest repair); unreadable YAML; invalid schema; invalid issuer; unknown status; broken event chain; bad event digest; invalid sequence; wrong status projection; bad grant_digest; bad record_digest; expires_at <= issued_at.'
  - 'issue() overlap semantics unchanged: succeeds with only historical records present; raises overlapping ACTIVE against an unexpired or expired ACTIVE grant for the same operation or the same task and checkpoint.'
  - 'load() runtime-tree, authority-version, approval-reference, and repository-backed checks remain unchanged and fail closed.'
  - 'consume() still requires a valid ACTIVE grant: not active for CONSUMED, expired for expired ACTIVE.'
  - 'TC017 historical qualification tests remain valid and pass unchanged.'
  - 'The three current real-date failures (test_repository_backed_recovery_authorization_issue_load_and_consume, test_recovery_authorization_rejects_overlap_bad_issuer_and_path_escape, test_recovery_authorization_runtime_tree_and_approval_fail_closed) return to PASS with the live expired CONSUMED records copied in.'
  - 'No live repository side effects: before/after hashes of .sdd/state/**, .sdd/authorizations/**, and .sdd/evidence/** are unchanged. Time-dependent cases use the existing _frozen_clock helper so results do not depend on the real date.'
acceptance_criteria:
  - 'AC1: _active_records() does not fail because a structurally intact CONSUMED, REVOKED, or EXPIRED record is past its expires_at; such records are never returned as active.'
  - 'AC2: An ACTIVE grant outside its time window stays unusable: load() and consume() raise expired or not yet valid.'
  - 'AC3: A valid ACTIVE grant inside its window is returned by enumeration, loads, and consumes exactly once.'
  - 'AC4: An integrity failure in any stored record still makes enumeration, and every operation that relies on it, fail closed: malformed or unreadable records; schema, issuer, purpose, status, or one_time errors; bad event chain or digest; wrong status projection; bad grant or record digests; expires_at <= issued_at.'
  - 'AC5: issue() continues rejecting overlapping authorization (same operation, or same task and checkpoint) against any record whose status remains ACTIVE, including an expired ACTIVE record (R6).'
  - 'AC6: load() keeps all its checks for the specific grant: path identity; validate(require_active) with its time checks; repository, branch, and baseline binding; repository backing; runtime-tree identity; approval reference; evidence availability; authority versions; overlap.'
  - 'AC7: consume() still requires a valid ACTIVE grant and keeps one-time consumption and replay protection.'
  - 'AC8: RecoveryAuthorization.validate(), load(), consume(), issue(), _persist(), the TC017 helpers, sdd_orchestrator/codex_adapter.py, and sdd_orchestrator/evidence_writer.py are unchanged.'
  - 'AC9: No authorization file is created, rewritten, transitioned, or deleted, and there is no expiry bypass.'
  - 'AC10: All tests in the verification file pass deterministically regardless of the real date, including the three that currently fail and the TC017 tests.'
  - 'AC11: No .sdd/state/**, evidence, or authorization side effects.'
  - 'AC12: The checkpoint diff contains only the two allowed files plus the task''s own atomic Stage08 evidence artifact.'
