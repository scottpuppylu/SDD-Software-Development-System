task_id: TC018
title: Repair recovery authorization store historical record enumeration
objective: >-
  Make RecoveryAuthorizationStore enumeration validate every stored recovery
  authorization's non-clock integrity instead of its present-time execution
  validity, so historical CONSUMED, REVOKED, or EXPIRED records past expires_at no
  longer break issue(), load(), or consume(), while ACTIVE grants keep full time,
  runtime, and binding enforcement and integrity failures still fail closed.
behavior_scope: >-
  RecoveryAuthorizationStore._active_records() enumeration only, plus one new
  private RecoveryAuthorizationStore._validate_record_integrity(record) helper in
  sdd_orchestrator/git_runtime.py. Do not change RecoveryAuthorization.validate(),
  load(), consume(), issue(), _persist(), _read(), relative_path(),
  _approval_reference_valid(), any RecoveryManager behavior, or the recovery
  executor.
task_class: RECOVERY_AUTHORIZATION_STORE_HISTORICAL_ENUMERATION_DEFECT
repair_classification: RECOVERY_AUTHORIZATION_STORE_HISTORICAL_ENUMERATION_DEFECT
root_cause: >-
  RECOVERY_AUTHORIZATION_STORE_HISTORICAL_ENUMERATION_DEFECT:
  RecoveryAuthorizationStore._active_records() (sdd_orchestrator/git_runtime.py)
  calls the full lifecycle check record.validate(require_active=False) on every
  stored authorization before filtering to ACTIVE. validate()
  (sdd_orchestrator/evidence_writer.py) always applies two current-time checks
  regardless of require_active: an issue time in the future, or the current time at
  or past expires_at, raises AUTHORITY_INVALID. Once any stored authorization's
  execution window ends, enumeration raises. This occurred when the first TC008
  grant expired at 2026-10-06T00:22:58Z, and holds for all five stored records by
  2026-10-06T07:19:16Z. Enumeration feeds conflict detection in issue() and load()
  and lookup by recovery operation in load(), so all of them fail. The defect is
  confined to the enumeration step; load(), consume(), and issue() validate the
  grant actually being used through a separate call that must keep its time checks.
