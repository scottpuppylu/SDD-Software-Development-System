task_id: TC015
title: Repair SPEC-017 historical checkpoint scope classification
objective: >-
  Repair SPEC-017 historical checkpoint scope validation so the exact task-bound
  atomic Stage08 evidence artifact is recognized as a valid governance artifact
  in addition to ordinary task allowed_paths, while preserving fail-closed
  rejection of every unrelated path.
behavior_scope: >-
  Historical recovery checkpoint changed-path classification only. Distinguish
  task implementation/test paths from the single exact original Stage08 evidence
  artifact bound by the RecoveryAuthorization, task identity, historical checkpoint,
  evidence identity and digest, and ordinary Stage08 execution provenance. Do not
  change normal Stage08 file-boundary semantics or create a generic .sdd/evidence
  allowlist.
root_cause: >-
  RECOVERY_HISTORICAL_CHECKPOINT_SCOPE_CLASSIFICATION_DEFECT:
  Stage08CodexRunner.recover_post_checkpoint_evidence() currently applies the
  task allowed_paths predicate to every historical checkpoint changed path. An
  ordinary atomic Stage08 checkpoint may also contain its exact task-bound evidence
  artifact, so the current predicate incorrectly rejects checkpoint
  6cbb7df678a671493520fa0f6abaddcc9bf61557 before verification dispatch.
repair_classification: RECOVERY_HISTORICAL_CHECKPOINT_SCOPE_CLASSIFICATION_DEFECT
authority_decision: >-
  A historical Stage08 checkpoint is scope-valid only when every changed path is
  either within the task's authorized implementation/test allowed_paths or is the
  one exact repository-governance evidence artifact required by ordinary Stage08
  and cryptographically and structurally bound to the target task, immutable
  checkpoint, original evidence identity and digest, Stage08 execution identity,
  and recovery operation. No path prefix or generic .sdd/evidence exception is
  authorized.
allowed_paths:
  - sdd_orchestrator/codex_adapter.py
  - tests/test_m6_codex_adapter.py
forbidden_scope:
  - modifying TC008 historical evidence
  - modifying or rewriting TC008 historical checkpoint or governed history
  - reusing or reactivating RECOVERY-AUTH-TC008-20261005T002258330057Z
  - generic .sdd/evidence allowlisting
  - weakening checkpoint, task, evidence, digest, command, authority, or scope validation
  - broadening TC008 or any other task allowed_paths
  - modifying TC008 task status
  - implementation-state reconciliation
  - qualification-state reconciliation
  - TC007 repair
  - TC009-TC011 recovery execution
  - TC014 reimplementation or rerun
  - TC013 or TC012 finalization
  - Stage09 execution or authority mutation
  - Stage10 execution or authority mutation
production_change_allowed: true
governance_contract_change_allowed: false
generic_evidence_allowlist_allowed: false
acceptance_criteria:
  - A historical checkpoint containing only task allowed_paths passes scope validation.
  - A historical checkpoint containing task allowed_paths plus its exact bound ordinary Stage08 evidence artifact passes scope validation.
  - Exact TC008 checkpoint 6cbb7df678a671493520fa0f6abaddcc9bf61557 passes historical checkpoint scope validation under a fresh valid authorization.
  - Evidence belonging to another task fails closed.
  - Evidence whose content digest differs from the bound original evidence fails closed.
  - An arbitrary file under .sdd/evidence fails closed.
  - An unrelated .sdd governance artifact fails closed.
  - An extra production or test path outside task allowed_paths fails closed.
  - TC008 historical evidence and historical checkpoint remain immutable.
  - RecoveryAuthorization one-time consumption and replay protection remain unchanged.
  - RECOVERY-AUTH-TC008-20261005T002258330057Z remains CONSUMED and cannot be reused or reactivated.
  - Normal Stage08 file-boundary and tasks()/select_task() semantics remain unchanged.
  - Recovery operation, task, checkpoint, original evidence, evidence digest, command, repository, branch, baseline, and authority bindings remain fail-closed.
  - TC009, TC010, and TC011 remain compatible with the same exact task-bound classification contract without executing their recovery operations.
verification_commands:
  - .\.venv\Scripts\python.exe -m pytest -q tests/test_m6_codex_adapter.py
dependencies:
  - docs/spec.md#SPEC-017
  - docs/Design.md#DES-017
  - AGENTS.md section 9.1
  - .sdd/convergence/TC014.yaml
  - .sdd/evidence/20261004T234738.495022Z-TC014.json
  - .sdd/authorizations/recovery/RECOVERY-AUTH-TC008-20261005T002258330057Z.yaml
  - TC008 nonqualifying attempt audit checkpoint d2a6624fbdcbb27387d3af98a623a450ea23df7c
  - TC008 authorization consumption checkpoint cde7a4cdba5025d84b04f273cbbddd7f5695086a
dependency_constraints:
  tc014_required: true
  successful_tc008_recovery_required: false
  consumed_tc008_authorization_reusable: false
governance_profile: SDD_STRICT
governance_reason: >-
  This task changes fail-closed classification at a protected SPEC-017 recovery
  execution boundary and must preserve exact evidence identity, replay protection,
  immutable history, and ordinary Stage08 scope semantics.
