task_id: TC017
title: Repair state-side SPEC-017 recovery evidence checkpoint scope classification
objective: >-
  Make RecoveryManager state-side recovery evidence resolution compatible with
  the same strict bound-original-evidence rule already used by the TC015 recovery
  executor, so qualifying TC008 recovery evidence resolves against historical
  checkpoint 6cbb7df678a671493520fa0f6abaddcc9bf61557, without weakening general
  allowed_paths validation, without making historical qualification depend on the
  current wall clock, and without performing reconciliation.
behavior_scope: >-
  State-side recovery evidence checkpoint changed-path classification only, within
  the recovery-kind branch of RecoveryManager._resolve_evidence() plus one private
  bound-original-evidence helper and one private historical-consumed-authorization
  integrity helper in sdd_orchestrator/git_runtime.py. Permit at most the single
  exact original Stage08 evidence artifact named as target_original_evidence by the
  repository-backed, historically intact CONSUMED RecoveryAuthorization bound to the
  recovery evidence. Do not change ordinary evidence resolution, authorization
  lifecycle, RecoveryAuthorization.validate(), reconciliation, the recovery
  executor, or Stage08 recovery architecture.
task_class: RECOVERY_STATE_EVIDENCE_SCOPE_CLASSIFICATION_DEFECT
repair_classification: RECOVERY_STATE_EVIDENCE_SCOPE_CLASSIFICATION_DEFECT
root_cause: >-
  RECOVERY_STATE_EVIDENCE_SCOPE_CLASSIFICATION_DEFECT:
  RecoveryManager._resolve_evidence() (sdd_orchestrator/git_runtime.py) rejects
  every recovery evidence checkpoint path outside task allowed_paths via
  set(changed) - set(task.allowed_paths). Historical checkpoint
  6cbb7df678a671493520fa0f6abaddcc9bf61557 also contains TC008's original
  Stage08 evidence artifact .sdd/evidence/20260924T103204.2963462Z-TC008.json, so
  the qualifying TC008 recovery evidence is rejected with "Recovery checkpoint
  exceeds task allowed paths". TC015 added the exact bound-evidence rule
  (_historical_checkpoint_scope_valid / _bound_atomic_stage08_evidence_valid) only
  to the executor in sdd_orchestrator/codex_adapter.py; the state-side validator
  never adopted an equivalent. The executor's exception is bound through the
  authorization's target_original_evidence, which is not carried in the recovery
  attestation payload, so the state side must resolve it from the
  repository-backed authorization record named by the attestation's
  authorization_id.
amendment:
  source: TC017 Stage07 review BLOCKED at 8ed43d37abd72b0640c3104a106a501b2a0d8d2f
  issue: >-
    The original plan validated the historical authorization through
    RecoveryAuthorization.validate(require_active=False). validate() always
    enforces current-time validity (issued_at in the future or now >= expires_at
    raises AUTHORITY_INVALID) regardless of require_active, so state-side
    qualification would fail closed permanently once each authorization's
    expires_at passed, making implementation qualification time-dependent.
  resolution: >-
    State-side resolution validates the repository-backed CONSUMED authorization's
    historical non-clock integrity locally in sdd_orchestrator/git_runtime.py and
    never compares any recorded time with the current wall clock.
    RecoveryAuthorization.validate() itself is unchanged.
blocked_operation: QUALIFICATION-STATE-RECONCILIATION-001
blocked_operation_reference: tasks.md section 11.6
