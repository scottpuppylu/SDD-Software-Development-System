authority_decision: >-
  A recovery evidence checkpoint is state-side scope-valid only when every changed
  path is within task allowed_paths, or when exactly one extra path exists and it
  is the single original ordinary Stage08 evidence artifact named as
  target_original_evidence by the repository-backed CONSUMED RecoveryAuthorization
  whose authorization_id, attempt_id, task, checkpoint, task-contract digest, and
  verification command match the recovery attestation, and the artifact passes the
  mirrored TC015 structural, identity, and content checks. No generic
  .sdd/evidence/** or path-prefix exception, no task or commit-hash special case.
allowed_paths:
