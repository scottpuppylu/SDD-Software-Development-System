  recovery_authorization: .sdd/authorizations/recovery/RECOVERY-AUTH-TC008-20261005T012644959809Z.yaml
authority_decision: >-
  A recovery evidence checkpoint is state-side scope-valid only when every changed
  path is within task allowed_paths, or when exactly one extra path exists and it
  is the single original ordinary Stage08 evidence artifact named as
  target_original_evidence by the repository-backed, historically intact CONSUMED
  RecoveryAuthorization whose authorization_id, attempt_id, task, checkpoint,
  task-contract digest, and verification command match the recovery attestation,
  and the artifact passes the mirrored TC015 structural, identity, and content
  checks. Historical authorization integrity is validated without reference to the
  current wall clock. No generic .sdd/evidence/** or path-prefix exception, no
  task or commit-hash special case, and no bypass for expired ACTIVE
  authorizations.
authorization_historical_integrity_checks:
  - 'Record source: read exactly .sdd/authorizations/recovery/<attestation.authorization_id>.yaml via RecoveryAuthorizationStore.relative_path() and _read() (RecoveryAuthorization.from_record() performs no clock checks); do not call validate() or load().'
  - 'Repository-backed: the authorization file has a latest commit that is an ancestor of HEAD, and its working blob equals that committed blob.'
  - 'schema_version == RECOVERY_AUTHORIZATION_SCHEMA_VERSION ("1.0") and record_kind == RECOVERY_AUTHORIZATION_RECORD_KIND.'
  - 'issuer == PROJECT_AUTHORITY and issuer_role == PROJECT_AUTHORITY.'
  - 'purpose == RECOVERY_CAPABILITY and one_time is True.'
  - 'status == CONSUMED.'
  - 'Exactly two status events: event 1 ACTIVE, actor PROJECT_AUTHORITY, reason ISSUED, previous_event_digest null; event 2 CONSUMED, actor RECOVERY_EXECUTOR, reason FRESH_VERIFICATION_DISPATCH, previous_event_digest equal to event 1 event_digest.'
  - 'Event chain: each event sequence equals its 1-based position and each event_digest == canonical_sha256(event body without event_digest).'
  - 'Status projection: the final event status equals status.'
  - 'grant_digest == canonical_sha256(grant_payload()).'
  - 'record_digest == canonical_sha256(to_record() without record_digest).'
  - 'Non-clock structural validity carried from validate(): authorization_id and attempt_id match [A-Za-z0-9_.-]+; target_checkpoint, baseline, and runtime_checkpoint are full 40-hex SHAs; task_contract_digest is 64-hex; authority_versions non-empty with 64-hex digests; allowed_artifact_paths non-empty, all under .sdd/ without ..; prohibited_operations and checkpoint_conditions non-empty; required fields non-blank.'
  - 'Historical-window consistency using only recorded times: issued_at and expires_at parse as UTC; expires_at > issued_at; event 1 occurred_at equals issued_at; event 2 occurred_at parses and issued_at <= event 2 occurred_at < expires_at.'
  - 'Bindings to the recovery attestation: authorization_id, attempt_id, target_task_id, target_checkpoint, task_contract_digest, and verification_command equal the attestation authorization_id, attempt_id, task_id, checkpoint_commit, task_contract_sha256, and verification_command; recovery_operation_id starts with RECOVERY-<task_id>-; target_original_evidence equals exactly the single extra checkpoint path.'
clock_fields_not_used_for_historical_validation:
  - 'expires_at is never compared with the current wall clock; it is compared only with issued_at and the CONSUMED event occurred_at.'
  - 'issued_at is never compared with the current wall clock; a historical issued_at is not a rejection reason.'
  - 'Status event occurred_at values are never compared with the current wall clock.'
  - 'Recovery attestation started_at, ended_at, and recorded_at are never compared with the current wall clock (recorded_at parsing in the unchanged implementation_qualification_binding remains).'
  - 'This clock independence applies only to historical CONSUMED authorization inspection for state-side recovery-evidence binding; ACTIVE (expired or not), EXPIRED, REVOKED, or any other status is rejected on this path, and RecoveryAuthorization.validate() and RecoveryAuthorizationStore.load() time checks remain unchanged.'
