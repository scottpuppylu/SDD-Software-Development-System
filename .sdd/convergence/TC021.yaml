allowed_change_detail:
  tests/test_m6_codex_adapter.py: >-
    Test fixture or expectation construction for the named historical
    checkpoint-scope test inherited by V1116GeneratedVerificationArtifactTests.
    Test authority may be constructed with the controlled fixture's exact
    repository, branch, baseline, and integrity-valid digest bindings.
