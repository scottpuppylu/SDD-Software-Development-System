  - Preserve exact branch binding validation.
  - Preserve baseline ancestry checks and recovery authorization integrity.
  - Preserve historical evidence-scope enforcement and all negative-path assertions.
  - Preserve production code byte-for-byte.
failure_expectations:
  - Any mismatched repository, branch, baseline, digest, checkpoint, command, task, or evidence scope remains rejected.
  - Any required production relaxation or historical-record mutation blocks implementation and routes back to Stage06 or Stage07.
  - Targeted verification failure prevents checkpoint eligibility.
security_governance_constraints:
