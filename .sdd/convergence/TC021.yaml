required_behavior_outcome:
  - Both collected instances of the named inherited test reach and pass their historical evidence-scope assertions.
  - Repository and branch mismatches continue to raise AUTHORITY_INVALID.
  - Baseline ancestry, authorization integrity, and historical evidence-scope checks remain exact and fail-closed.
preservation_obligations:
