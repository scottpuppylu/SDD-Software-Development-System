task_id: TC021
title: M6 recovery binding portability expectation defect
objective: >-
  Make the historical-checkpoint-scope test portable by constructing or
  binding test authorization to a controlled test repository identity instead
  of expecting production code to accept mismatched historical repository or
  branch bindings.
task_class: M6_RECOVERY_BINDING_PORTABILITY_EXPECTATION_DEFECT
repair_classification: TEST_EXPECTATION_DEFECT
root_cause: >-
  The test reuses a historical authorization bound to a Windows absolute
  repository path and branch telemetry-measurement-v2 while Codex Cloud uses
  /workspace/SDD-Software-Development-System and platform branch work. The
  production resolver correctly fails closed with AUTHORITY_INVALID recovery
  repository binding mismatch before the historical-scope assertions execute.
traceability:
  - docs/spec.md SPEC-017
  - docs/Design.md DES-017
  - AGENTS.md section 9.1
  - tasks.md TASK-019 recovery binding requirements
  - Stage09 execution evidence at e2542e5f59f52588d081e55bbbc85582532d4bb1
allowed_paths:
