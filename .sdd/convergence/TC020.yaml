task_id: TC020
title: M10 Stage09 fixture no-op commit defect
objective: >-
  Repair only the M10 Stage09 fixture assumption that _set_stage09() must
  always create a Git commit when the canonical source state is already
  Stage09 IN_PROGRESS, so the existing behavioral assertions execute without
  weakening their semantics or changing production code.
task_class: M10_STAGE09_FIXTURE_NOOP_COMMIT_DEFECT
repair_classification: TEST_FIXTURE_DEFECT
root_cause: >-
  M10Tests._set_stage09() rewrites project-state.yaml to the Stage09
  IN_PROGRESS values already present at the current baseline, stages no
  content change, and then unconditionally invokes git commit -m stage09.
  Git correctly exits 1 because there is nothing to commit, so three tests
  fail before their behavioral assertions execute.
traceability:
  - AGENTS.md section 8
  - tasks.md section 10
  - .sdd/stages.yaml Stage09 IMPLEMENTATION_GAP convergence routing
  - Stage09 execution evidence at e2542e5f59f52588d081e55bbbc85582532d4bb1
allowed_paths:
  - tests/test_m10_convergence_auto.py
allowed_change_detail:
  tests/test_m10_convergence_auto.py: >-
    Fixture setup and transition preparation used by the three named
    M10Tests only. The fixture may establish a deterministic pre-Stage09 state
    or avoid requiring a commit when the intended state is already present.
forbidden_scope:
  - tests/test_m6_codex_adapter.py
  - sdd_orchestrator/**
  - any other production or test file
