  task execution, or assertion strength.
required_behavior_outcome:
  - The authority-conflict test still proves that an authority contract conflict cannot emit a convergence task.
  - The implementation-gap test still proves convergence-task persistence and routing to Stage08.
  - The generated convergence-task test still proves authorized Stage08 execution and completion behavior.
  - A genuine unexpected fixture Git failure remains visible and fail-closed.
